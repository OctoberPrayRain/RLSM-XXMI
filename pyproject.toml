[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rlsm"
version = "0.1.0"
description = "Rainy Linux Skin Manager for XXMI games"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.gui-scripts]
rlsm = "rlsm.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlsm = [
    "qml/**/*.qml",
    "qml/qmldir",
    "resources/**/*.json",
    "resources/**/*.svg",
]

